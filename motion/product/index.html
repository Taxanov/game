  Интро BAVIX «Кусочки продукта»: на щелчки звука появляются фрагменты интерфейсов (CRM, бот, график, приложение,
  воронка, ИИ, сайт), на ударе 2.25 они схлопываются в шеврон X, и из него собирается логотип.
  Каждый кадр — функция времени render(t). Параметры: ?w=1920&h=1080&end=em|white&t=5.25&play
  Звук: ../logo-intro/audio.m4a. Склейки на щелчки 0.95–1.70 с, удар 2.25, акцент 3.15, главный удар 5.25, волна 7.0–7.6.

<style>

  #tag span { display: inline-block; overflow: hidden; }

  #tag b { color: var(--em); font-weight: 500; }
  #emLayer { position: absolute; inset: 0; background: var(--em); color: var(--ink); }
  #emLayer svg { position: absolute; overflow: visible; }
  #emTag { position: absolute; display: flex; gap: .9em; transform: translateX(-50%); font: 500 var(--fs-tag) / 1 "Unbounded", sans-serif; letter-spacing: .32em; text-transform: uppercase; white-space: nowrap; color: rgba(17,17,17,.75); }

  .phone .scr { background: #fff; border-radius: calc(var(--u) * 22px); padding: 1.6em 1em 1em; height: 100%; display: flex; flex-direction: column; gap: .7em; }

  .chip { background: #fff; border-radius: .45em; padding: .5em; display: grid; gap: .35em; }
  .chip.on { outline: 2px solid var(--em); }
  .ai { display: flex; align-items: center; gap: .8em; }
  .spark { width: 2.4em; height: 2.4em; border-radius: .7em; background: var(--em); display: grid; place-items: center; flex: none; }
  .spark svg { width: 1.3em; height: 1.3em; }
  .dots { display: inline-flex; gap: .25em; margin-left: .3em; } .dots i { width: .35em; height: .35em; border-radius: 50%; background: #00825B; }
  .browser { padding: 0; overflow: hidden; }
  .bbar { display: flex; align-items: center; gap: .4em; padding: .7em .9em; background: #F4F4F2; border-bottom: 1px solid #E6E6E6; }
  .bbar i { width: .65em; height: .65em; border-radius: 50%; background: #D6D6D2; }
  .url { margin-left: .8em; flex: 1; background: #fff; border-radius: .5em; padding: .35em .7em; font-size: .78em; color: #555; }
  .site { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.2em; padding: 1.4em; align-items: center; }
  .site h4 { font: 700 1.35em/1.1 "Unbounded"; text-transform: uppercase; letter-spacing: -.01em; margin: 0 0 .6em; }
  .site h4 em { font-style: normal; background: var(--em); padding: 0 .1em; }
  .site .btn { display: inline-block; margin-top: .9em; padding: .8em 1.1em; }
  .hero-img { aspect-ratio: 1; border-radius: 1em; background: var(--ink); position: relative; overflow: hidden; }
  .hero-img svg { position: absolute; width: 70%; height: 70%; left: 15%; top: 15%; color: var(--em); }
</style>

  }
  function hex(a, b, p) {
    var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); }), pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
    return "rgb(" + pa.map(function (v, i) { return Math.round(lerp(v, pb[i], p)); }).join(",") + ")";
  }

  function render(t) {
    var fr = Math.round(t * FPS), bg, labelColor;
    ALL.forEach(function (id) { els[id].removeAttribute("transform"); });
    trackEls.forEach(function (l) { l.style.opacity = 0; });
    els.pU.style.opacity = 0;

    var showCards = t < 2.3;
    cardsEl.style.display = showCards ? "" : "none";
    if (showCards) {
      /* ---- фрагменты продукта ---- */
      var cp = E.in(seg(t, 2.02, 2.25));                 // схлопывание в центр к удару
      CARDS.forEach(function (c, i) {
        var ap = E.expo(seg(t, c.at, c.at + 0.45)), vis = t >= c.at;
        var drift = Math.sin((t + i * 1.7) * 1.4) * 5 * u;
        /* медленный наезд камеры на весь коллаж */
        var zoom = 1 + 0.07 * E.io(seg(t, 0, 2.05));
        var hx = W / 2 + (c.x - W / 2) * zoom, hy = H / 2 + (c.y - H / 2) * zoom;
        var x = lerp(hx, W / 2, cp), y = lerp(hy + (1 - ap) * 40 * u + drift, H / 2, cp);
        var sc = lerp(0.9, 1, ap) * zoom * lerp(1, 0.08, cp);
        c.el.style.display = vis && cp < 1 ? "" : "none";
        c.el.style.opacity = Math.min(1, seg(t, c.at, c.at + 0.12)) * (1 - seg(t, 2.18, 2.25));
        c.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) translate(-50%,-50%) scale(" + sc.toFixed(4) + ")";
        c.el.style.zIndex = i + 1;
        var lt = t - c.at;
        if (c.grow) c.grow.style.transform = "scaleX(" + (0.15 + 0.53 * E.out(seg(lt, 0.15, 0.9))) / 0.68 * 0.68 + ")";
        Array.prototype.forEach.call(c.bars, function (b, j) { b.style.transform = "scaleY(" + E.expo(seg(lt, 0.05 + j * 0.04, 0.45 + j * 0.04)) + ")"; });
        Array.prototype.forEach.call(c.dots, function (d, j) { d.style.opacity = 0.3 + 0.7 * (Math.floor(t * 6 + j) % 3 === 0 ? 1 : 0); });
        if (c.ai && lt > 0.45 && c.ai.dataset.done !== "1") { c.ai.innerHTML = "<b style='color:#00825B'>КП готово за 2 сек ✓</b>"; c.ai.dataset.done = "1"; }
        if (c.ai && lt <= 0.45 && c.ai.dataset.done === "1") { c.ai.innerHTML = 'Считаю площадь и цену<span class="dots"><i></i><i></i><i></i></span>'; c.dots = c.ai.querySelectorAll(".dots i"); c.ai.dataset.done = ""; }
      });
    }
    if (t < 2.25) {
      bg = "#F4F4F2";
      labelColor = C.ink;
      ALL.forEach(function (id) { els[id].style.display = "none"; });
    } else {
      /* ---- одно непрерывное движение: отъезд камеры, буквы съезжают по рельсам ---- */
      bg = C.white;
      labelColor = C.ink;
      var zp = 1 - Math.pow(1 - seg(t, 2.25, 5.25), 2.2);
      var s0 = FIT.s * 1.7, s = Math.exp(lerp(Math.log(s0), Math.log(FIT.s), zp));
      var push = 1 + 0.025 * seg(t, 5.25, 7.0);
      setCam(lerp(830, FIT.cx, E.io(seg(t, 2.25, 5.25))), lerp(65, FIT.cy, zp), s * push);
      var landed = t >= 5.245;
      LET.forEach(function (L) {
        var el = els[L.id];
        el.style.display = "";
        var lp = L.id === "pT" || L.id === "pD" ? E.in(seg(t, 4.95, L.land)) : L.start ? E.io(seg(t, L.start, L.land)) : 1;
        var dx = (L.dx || 0) * (1 - lp), dy = L.dy * (1 - lp);
        if ((L.id === "pT" || L.id === "pD") && t < 4.95) el.style.display = "none";
        var tf = "translate(" + dx.toFixed(2) + " " + dy.toFixed(2) + ")";
        if (L.id === "pC") { var pop = 0.55 + 0.45 * E.expo(seg(t, 2.25, 2.7)); tf = "translate(823.9 65) scale(" + pop.toFixed(4) + ") translate(-823.9 -65)"; }
        el.setAttribute("transform", tf);
        /* цвет: изумруд в полёте → графит в момент удара; финал «white» — волна изумруда 7.0–7.8 */
        var col = landed ? C.ink : C.em;
        if (END === "white") {
          var idx = ALL.indexOf(L.id), wp = seg(t, 7.0 + Math.min(idx, 4) * 0.12, 7.0 + Math.min(idx, 4) * 0.12 + 0.36);
          var a = Math.sin(Math.PI * wp);
          if (a > 0.01) col = hex(C.ink, C.em, a);
        }
        el.style.fill = col;
      });
      /* небольшой «щелчок» масштаба на ударе */
      var kick = t >= 5.245 && t < 5.5 ? 1 + 0.035 * (1 - E.out(seg(t, 5.245, 5.5))) : 1;
      if (kick !== 1) setCam(FIT.cx, FIT.cy, FIT.s * kick * push);
      /* рельсы сетки: проявляются к акценту 3.15, уходят после удара */
      var tr = seg(t, 2.6, 3.15) * (1 - seg(t, 5.3, 5.8));
      trackEls.forEach(function (l) { l.style.opacity = (0.22 * tr).toFixed(3); l.style.stroke = C.ink; });
      /* «_» */
      var uOn = t >= 5.35 && (t < 6.2 || Math.floor((t - 6.2) / 0.52) % 2 === 0);
      if (t >= 5.35 && t < 5.5) uOn = Math.floor(fr / 3) % 2 === 0;
      els.pU.style.opacity = uOn ? 1 : 0; els.pU.style.fill = C.em;
    }

    stage.style.background = bg;
    labels.forEach(function (l) { l.style.color = labelColor; l.style.opacity = labelColor === C.ink ? .75 : .8; });

    /* подпись: слова выезжают из-под маски по очереди */
    Array.prototype.forEach.call(tag.children, function (s, i) {
      var tp = E.expo(seg(t, 5.55 + i * 0.07, 6.15 + i * 0.07));
      s.firstChild.style.transform = "translateY(" + ((1 - tp) * 110) + "%)";
      s.style.color = "rgba(17,17,17,.78)";
    });

    /* финал «em»: шеврон X растёт и становится порталом в изумрудный кадр */
    var portal = $("portal"), em = $("emLayer");
    if (END === "em" && t >= 6.98) {
      var pp = E.io(seg(t, 6.98, 7.6));
      var cH = LH * lerp(1, 18, pp * pp), cW = cH * 94.7 / 130;
      var ax = (W - LW) / 2 + 841.5 * k + (FIT.cx - 512) * 0, ay = LY + 65 * k;  // центр шеврона
      portal.style.display = ""; portal.style.width = cW + "px"; portal.style.height = cH + "px";
      portal.style.left = (ax - cW * (841.5 - 776.5) / 94.7) + "px"; portal.style.top = (ay - cH / 2) + "px";
      if (t >= 7.6) {
        portal.style.display = "none"; em.style.display = "";
        var lp2 = E.expo(seg(t, 7.6, 8.25));
        emLogo.style.transform = "translateY(" + ((1 - lp2) * LH * 0.6) + "px)"; emLogo.style.opacity = seg(t, 7.6, 7.85);
        emTag.style.opacity = seg(t, 7.85, 8.25);
        gh.style.transform = "translateX(" + ((1 - E.expo(seg(t, 7.6, 8.6))) * W * 0.15) + "px)";
        $("emU").style.opacity = (t < 8.3 || Math.floor((t - 8.3) / 0.52) % 2 === 1) ? 1 : 0;
      } else em.style.display = "none";
    } else { portal.style.display = "none"; em.style.display = "none"; }
  }

  window.__render = render;
  window.__meta = { W: W, H: H, FPS: FPS, DUR: DUR, END: END };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
    var ft = q.get("t");
    if (ft !== null) { render(parseFloat(ft)); window.__ready = true; return; }
    window.__ready = true;
    if (q.get("play") !== null) { var t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); }
    else render(0);
  });
})();
</script>
</body>
